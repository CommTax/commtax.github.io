    // ============================================================
    // PAYMENT VERIFICATION FUNCTIONS

    async function checkPaymentStatus() {
        if (!submissionId) {
            return { verified: false, error: 'Missing submission ID' };
        }

        try {
            var url = APPS_SCRIPT_URL + '?action=checkPayment&id=' + encodeURIComponent(submissionId);
            console.log('📞 Checking payment via:', url);
            var response = await fetch(url);
            var result = await response.json();
            console.log('📦 Payment check response:', result);

            if (result.success) {
                var isPaid = result.isPaid === true;

                if (!isPaid && result.paymentStatus) {
                    var paidStatuses = ['completed', 'captured', 'paid', 'success', 'Completed', 'Captured', 'Paid', 'Success'];
                    isPaid = paidStatuses.indexOf(result.paymentStatus) > -1;
                }
                
                if (!isPaid && result.paymentId && result.paymentId !== '' && result.paymentId !== 'pending' && result.paymentId !== 'null') {
                    isPaid = true;
                }
                
                console.log('✅ isPaid:', isPaid);

                return {
                    verified: isPaid,
                    data: result,
                    paymentStatus: result.paymentStatus,
                    paymentId: result.paymentId
                };
            } else {
                throw new Error(result.error || 'Payment check failed');
            }
        } catch (error) {
            console.error('❌ Error checking payment:', error);
            return { verified: false, error: error.message };
        }
    }

    async function checkPaymentWithRetry(maxRetries = 5) {
        var lastResult = null;
        
        for (var attempt = 1; attempt <= maxRetries; attempt++) {
            var attemptEl = document.getElementById('verifyAttempt');
            if (attemptEl) {
                attemptEl.textContent = attempt;
            }
            
            var result = await checkPaymentStatus();
            console.log(`Attempt ${attempt}:`, result);
            
            if (result.verified) {
                return result;
            }
            
            if (result.paymentStatus === 'processing' || 
                result.paymentStatus === 'pending' ||
                result.paymentStatus === 'initiated') {
                console.log(`Attempt ${attempt}: Payment still processing, waiting...`);
                await sleep(2000 * attempt);
                continue;
            }
            
            if (result.error && attempt < maxRetries) {
                console.log(`Attempt ${attempt}: Error, retrying...`);
                await sleep(1000 * attempt);
                lastResult = result;
                continue;
            }
            
            if (!result.verified && !result.error) {
                return result;
            }
            
            lastResult = result;
        }
        
        return lastResult || { verified: false, error: 'Max retries exceeded' };
    }

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function formatNumber(num) {
        if (!num) return '0';
        return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    function getScoreColor(score) {
        if (score >= 70) return '#00C4A7';
        if (score >= 50) return '#F59E0B';
        return '#EF4444';
    }

    function extractCompetencyName(compString) {
        if (!compString) return '';
        var cleaned = compString.replace(/[🔴🟢🟡🟠🔵🌟💪✅📈⚠️]/g, '').trim();
        var match = cleaned.match(/^([^(]+)/);
        return match ? match[1].trim() : cleaned;
    }

        var highest = extractCompetencyName(highestStr);

    // ============================================================
    // DRAW RING
    // ============================================================
    function drawRing(canvasId, score, color) {
        var canvas = document.getElementById(canvasId);
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var cx = 60, cy = 60, radius = 48;
        var startAngle = -Math.PI / 2;
        var endAngle = startAngle + (score / 100) * 2 * Math.PI;

        ctx.clearRect(0, 0, 120, 120);
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
        ctx.strokeStyle = '#F3F4F6';
        ctx.lineWidth = 8;
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(cx, cy, radius, startAngle, endAngle);
        ctx.strokeStyle = color;
        ctx.lineWidth = 8;
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.font = 'bold 18px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(score + '%', cx, cy);
    }

        var container = document.getElementById('ringsGrid');
        if (!container) return;

        function parsePct(value) {
            if (!value) return 0;
            if (typeof value === 'string') {
                var cleaned = value.replace('%', '').trim();
                return parseFloat(cleaned) || 0;
            }
            return Number(value) || 0;
        }

        var competencies = [
            { id: 'Thinking', score: parsePct(data.thinkingPct), level: data.thinkingLevel || 'Proficient' },
            { id: 'Structure', score: parsePct(data.structurePct), level: data.structureLevel || 'Proficient' },
            { id: 'Communication', score: parsePct(data.communicationPct), level: data.communicationLevel || 'Needs Attention' },
            { id: 'Understanding', score: parsePct(data.understandingPct), level: data.understandingLevel || 'Needs Attention' },
            { id: 'Opportunity', score: parsePct(data.opportunityPct), level: data.opportunityLevel || 'Proficient' }
        ];

        competencies.forEach(function(comp) {
            var color = getScoreColor(comp.score);
            var div = document.createElement('div');
            div.className = 'ring-item';

            div.innerHTML =

                <div style="font-size:12px;color:#6B7280;">${comp.level}</div>`;
            container.appendChild(div);
            setTimeout(function() {

    // RENDER WATERFALL
    // ============================================================
    function renderWaterfall(data) {
        var container = document.getElementById('waterfallContainer');
        if (!container) return;

        var communication = Math.round((data.communicationPct || 0) * 100);
        var understanding = Math.round((data.understandingPct || 0) * 100);
        var opportunity = Math.round((data.opportunityPct || 0) * 100);
        var thinking = Math.round((data.thinkingPct || 0) * 100);
        var structure = Math.round((data.structurePct || 0) * 100);

        var items = [
            { label: 'Communication', value: Math.max(0, 60 - communication) * 100000, color: '#EF4444' },
            { label: 'Opportunity', value: Math.max(0, 60 - opportunity) * 150000, color: '#F97316' },
            { label: 'Understanding', value: Math.max(0, 60 - understanding) * 50000, color: '#F59E0B' },
            { label: 'Thinking', value: Math.max(0, 60 - thinking) * 0, color: '#00C4A7' },
            { label: 'Structure', value: Math.max(0, 60 - structure) * 0, color: '#10B981' }
        ];

        var total = 0;
        items.forEach(function(item) { total += item.value; });

        if (total === 0) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:#6B7280;">✅ No significant tax leakage detected. Your communication is well aligned.</div>';
            return;
        }

        var maxVal = Math.max(total, 1);
        var html = '';

        items.forEach(function(item) {
            if (item.value > 0) {
                var pct = (item.value / maxVal) * 100;
                html +=
                    '<div class="wf-row">' +
                    '<span class="wf-label">' + item.label + '</span>' +
                    '<div class="wf-bar"><div class="wf-fill" style="width:' + Math.min(pct, 100) + '%;background:' + item.color + ';"></div></div>' +
                    '<span class="wf-amount" style="color:' + item.color + ';">₹' + formatNumber(item.value) + '</span>' +
                    '</div>';
            }
        });

        html +=
            '<div class="wf-total">' +
            '<span>TOTAL ANNUAL TAX</span>' +
            '<span class="wf-total-amount">₹' + formatNumber(total) + '</span>' +
            '</div>';

        container.innerHTML = html;
    }

            description: 'Communication Tax™ Full Report',
            prefill: { email: reportData ? reportData.email : '' },
            notes: { submissionId: submissionId },
            handler: function(response) {
                window.location.href = window.location.pathname + '?id=' + submissionId + '&payment_id=' + response.razorpay_payment_id;
            }
        };
        var rzp = new Razorpay(options);
        rzp.open();
    }

    // ============================================================
    // DOWNLOAD PDF
    // ============================================================
    function downloadPDF() {
        var element = document.getElementById('reportContainer');
        var opt = {
            margin: 10,
            filename: 'Executive_Communication_Report.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
        console.log('🚀 Initializing report...');

        if (paymentId) {
            sessionStorage.setItem('unlocked_' + submissionId, 'true');
            if (window.history && window.history.replaceState) {
                var newUrl = window.location.pathname + '?id=' + submissionId;
                window.history.replaceState({}, document.title, newUrl);
            }
        }

        if (sessionStorage.getItem('unlocked_' + submissionId) === 'true') {
            isUnlocked = true;
            var data = await fetchReportData();
            if (data) {
                hideVerificationOverlay();
                renderReport(data);
                await loadAllNarratives(submissionId);
            }
            return;
        }

        await verifyPaymentAndLoadReport();

        var payBtn = document.getElementById('payButton');
        if (payBtn) payBtn.addEventListener('click', initiatePayment);

        var downloadBtn = document.getElementById('downloadButton');
        if (downloadBtn) downloadBtn.addEventListener('click', downloadPDF);

        document.querySelectorAll('.btn-download').forEach(function(btn) {
            btn.addEventListener('click', downloadPDF);
        });
    }

    // ============================================================
    // START THE APP
    // ============================================================
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    // ============================================================
    // EXPOSE GLOBALLY
    // ============================================================
    window.initiatePayment = initiatePayment;
    window.downloadPDF = downloadPDF;
    window.hideVerificationOverlay = hideVerificationOverlay;
    </script>
</body>
</html>
