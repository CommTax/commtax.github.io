<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Unspoken - Communication Orbit</title>
    <style>
        /* Import Premium Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@200;400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030305;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
        }

        /* 9:16 Portrait Canvas Aspect Ratio Container */
        .canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 85vh; /* Maintains 9:16 aspect ratio */
            max-height: 100vh;
            background: radial-gradient(circle at center, #0d0f18 0%, #030305 100%);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 10px;
        }

        /* Ambient Glow Backlight */
        .ambient-glow {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.18) 0%, rgba(0, 212, 255, 0.05) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            filter: blur(40px);
            pointer-events: none;
        }

        canvas#particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Header / Branding */
        .header {
            z-index: 10;
            text-align: center;
            margin-top: 20px;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            letter-spacing: 6px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #a1a8c3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .brand-subtitle {
            font-size: 9px;
            letter-spacing: 4px;
            color: #626982;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* 3D Orbit Stage */
        .stage {
            position: relative;
            width: 100%;
            height: 55%;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .orbit-container {
            position: relative;
            width: 360px;
            height: 360px;
            transform-style: preserve-3d;
            /* Updated: Reduced tilt from rotateX(65deg) to rotateX(40deg) for better readability */
            transform: rotateX(40deg) rotateY(-5deg);
        }

        /* Elliptical Path Rings */
        .orbit-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.25), inset 0 0 15px rgba(0, 212, 255, 0.12);
        }

        .orbit-ring-inner {
            position: absolute;
            top: 15%;
            left: 15%;
            width: 70%;
            height: 70%;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.08);
        }

        /* Central Core Node */
        .core-node {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px #ffffff, 0 0 35px #8a2be2;
        }

        /* Persona Nodes & Labels */
        .node {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            transform-style: preserve-3d;
        }

        .node-dot {
            width: 14px;
            height: 14px;
            background: #00d4ff;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 12px #00d4ff, 0 0 24px #00d4ff;
        }

        /* Custom glow colors for specific personas */
        .node[data-persona="Misaligned"] .node-dot {
            background: #ff3366;
            box-shadow: 0 0 10px #ff3366, 0 0 20px #ff3366;
        }

        .node[data-persona="Emerging"] .node-dot {
            background: #ffbb00;
            box-shadow: 0 0 10px #ffbb00, 0 0 20px #ffbb00;
        }

        .node-label {
            position: absolute;
            top: -28px;
            left: 50%;
            /* Counter-rotate set to -40deg to match the new orbit tilt */
            transform: translateX(-50%) rotateX(-40deg);
            white-space: nowrap;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 6px rgba(255, 255, 255, 0.4);
            pointer-events: none;
        }

        /* Footer / Bottom Line Statement */
        .footer {
            z-index: 10;
            text-align: center;
            max-width: 85%;
            margin-bottom: 30px;
        }

        .bottom-line {
            font-size: 13px;
            line-height: 1.6;
            font-weight: 200;
            color: #a0a7ba;
            letter-spacing: 0.5px;
        }

        .highlight {
            color: #ffffff;
            font-weight: 400;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <!-- Ambient Glow Backlight -->
        <div class="ambient-glow"></div>

        <!-- Floating Dust Particles Canvas -->
        <canvas id="particles"></canvas>

        <!-- Top Header / Branding -->
        <div class="header">
            <div class="brand-title">The Unspoken</div>
            <div class="brand-subtitle">Communication Dynamics</div>
        </div>

        <!-- 3D Orbit Stage -->
        <div class="stage">
            <div class="orbit-container">
                <div class="orbit-ring"></div>
                <div class="orbit-ring-inner"></div>
                <div class="core-node"></div>

                <!-- 7 Persona Nodes Container -->
                <div id="nodes-group"></div>
            </div>
        </div>

        <!-- Bottom Line Text -->
        <div class="footer">
            <p class="bottom-line">
                There is a <span class="highlight">pattern underneath</span> the way you communicate.
            </p>
        </div>
    </div>

    <script>
        // --- 1. SETUP PERSONAS & ORBIT ANIMATION ---
        const personas = [
            "Translator",
            "Amplifier",
            "Articulator",
            "Interpreter",
            "Filter",
            "Emerging",
            "Misaligned"
        ];

        const nodesGroup = document.getElementById('nodes-group');
        const radius = 180; // Orbital ring radius in px
        const totalNodes = personas.length;
        const nodeElements = [];

        // Generate Node Elements
        personas.forEach((persona, index) => {
            const node = document.createElement('div');
            node.className = 'node';
            node.setAttribute('data-persona', persona);

            const dot = document.createElement('div');
            dot.className = 'node-dot';

            const label = document.createElement('div');
            label.className = 'node-label';
            label.innerText = persona;

            node.appendChild(dot);
            node.appendChild(label);
            nodesGroup.appendChild(node);

            nodeElements.push({
                element: node,
                label: label,
                angle: (index / totalNodes) * Math.PI * 2
            });
        });

        // Reduced rotation speed for a slower, smoother rotation (previously 0.005)
        let rotationSpeed = 0.002;

        function animateOrbit() {
            nodeElements.forEach((nodeObj) => {
                // Update angle for continuous rotation
                nodeObj.angle += rotationSpeed;

                // Calculate 3D position on 2D plane
                const x = Math.cos(nodeObj.angle) * radius;
                const y = Math.sin(nodeObj.angle) * radius;

                // Position node relative to orbit center
                nodeObj.element.style.transform = `translate3d(${x}px, ${y}px, 0px)`;

                // Depth-based Opacity & Scaling for 3D realism
                const depth = (Math.sin(nodeObj.angle) + 1) / 2; // 0 (back) to 1 (front)
                const scale = 0.85 + (depth * 0.3); // Kept text larger when in back
                const opacity = 0.5 + (depth * 0.5); // Slightly higher min-opacity for front readability

                nodeObj.label.style.opacity = opacity;
                nodeObj.label.style.transform = `translateX(-50%) rotateX(-40deg) scale(${scale})`;
            });

            requestAnimationFrame(animateOrbit);
        }

        animateOrbit();

        // --- 2. BACKGROUND FLOATING PARTICLES ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particleCount = 40;
        const particles = [];

        for (let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                alpha: Math.random() * 0.5 + 0.1,
                speedY: - (Math.random() * 0.2 + 0.05),
                speedX: (Math.random() - 0.5) * 0.15
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;

                // Loop particles smoothly
                if (p.y < 0) p.y = canvas.height;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.fill();
            });

            requestAnimationFrame(animateParticles);
        }

        animateParticles();
    </script>
</body>
</html>
